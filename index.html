<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Ti ❤️</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, #ff9a9e, #fad0c4);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      max-width: 400px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }

    h1 {
      color: #e91e63;
    }

    p {
      color: #555;
      font-size: 18px;
      line-height: 1.6;
    }

    button {
      background: #e91e63;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 20px;
    }

    button:hover {
      background: #d81b60;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>❤️ Para Mi Pulga Hermosa ❤️</h1>

    <p>
      Gracias por llenar mi vida de alegría y hacer que cada día sea especial.
      Eres la mejor parte de mis días y quiero que siempre recuerdes cuánto te amo.
      Recuerda nuestra meta El Templo ❤️
    </p>

    <button onclick="mostrarMensaje()">Haz clic aquí</button>
  </div>

  <script>
    function mostrarMensaje() {
      alert("Te amo muchísimo Pulga. ❤️ Gracias por estar conmigo mi nena. 🌹");
    }
  </script>

</body>
</html>
